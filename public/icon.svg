<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    A waveform that stops.
    Ten bars rising and falling, then a gap where the eleventh should be, then silence.
    It is the show's freeze and the app's whole idea in one shape, and it stays
    legible at 16 pixels because it is only vertical bars.
  -->
  <rect width="512" height="512" rx="114" fill="#0e1621"/>

  <g fill="#e6f0fa">
    <rect x="104" y="232" width="20" height="48"  rx="10"/>
    <rect x="142" y="196" width="20" height="120" rx="10"/>
    <rect x="180" y="150" width="20" height="212" rx="10"/>
    <rect x="218" y="182" width="20" height="148" rx="10"/>
    <rect x="256" y="128" width="20" height="256" rx="10"/>
    <rect x="294" y="176" width="20" height="160" rx="10"/>
  </g>

  <g fill="#3f86c4">
    <rect x="332" y="210" width="20" height="92" rx="10"/>
    <rect x="370" y="240" width="20" height="32" rx="10"/>
  </g>

  <!-- the tenth second: a hollow mark where the sound should have been -->
  <circle cx="418" cy="256" r="10" fill="none" stroke="#3f86c4" stroke-width="5" opacity=".55"/>
</svg>
